name: Publish

# Release-triggered automatic npm publish via npm Trusted Publisher (OIDC).
# Create a GitHub Release (e.g. tag v0.8.1) to publish to npm — no NPM_TOKEN needed.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance + Trusted Publisher OIDC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Guard: the release tag (vX.Y.Z) must match package.json "version".
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
